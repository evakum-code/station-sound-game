<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>버스 타기 국어 게임 - 정류장 이름 읽기</title>
  <meta name="description" content="방송을 듣고 알맞은 정류장 이름을 찾는 어린이 국어 게임">
  <style>
    :root{--sky:#dff5f6;--sky2:#b8e5ec;--navy:#174c78;--navy2:#103956;--blue:#2e79b8;--yellow:#ffd85a;--orange:#e6783d;--green:#5da95b;--grass:#86bd5b;--ink:#163044;--paper:#fffdf6;--soft:#eef7f4;--line:#b8d4d6;--red:#d95148;--shadow:0 7px 0 rgba(17,57,86,.13);--radius:22px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Noto Sans KR",Arial,sans-serif;color:var(--ink);background:var(--sky);letter-spacing:0}button,input{font:inherit}button{touch-action:manipulation}button:focus-visible,input:focus-visible{outline:5px solid var(--yellow);outline-offset:3px}
    .app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden;background:linear-gradient(var(--sky),var(--sky2) 64%,#a7d375 64%,#82bd59 73%,#87959e 73%)}
    .topbar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;min-height:76px;padding:10px clamp(14px,3vw,36px);background:var(--paper);border-bottom:4px solid var(--navy)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,3vw,30px)}.brand-bus{font-size:38px}.sound-toggle,.records-btn,.icon-btn{border:3px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:14px;min-width:52px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 rgba(16,57,86,.14)}
    .sound-toggle{margin-left:auto;font-size:25px}.records-btn{font-size:15px;padding:0 14px}.screen{display:none;position:relative;z-index:2;min-height:calc(100dvh - 76px)}.screen.active{display:flex}
    .start{align-items:center;justify-content:center;padding:28px 18px}.start-card{width:min(900px,96vw);background:var(--paper);border:5px solid var(--navy);border-radius:var(--radius);padding:clamp(20px,4vw,42px);box-shadow:var(--shadow);text-align:center}.start h1{font-size:clamp(32px,6vw,60px);line-height:1.15;margin:0 0 12px;color:var(--navy)}.start-line{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(20px,3vw,30px);font-weight:800;margin:10px 0 24px}.level-label{text-align:left;font-size:20px;font-weight:900;margin:16px 0 10px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level{min-height:92px;padding:10px;border:3px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font-size:19px;font-weight:900;cursor:pointer}.level small{display:block;font-size:14px;font-weight:700;margin-top:5px}.level.selected{background:var(--yellow);border-color:var(--navy);transform:translateY(-2px);box-shadow:0 5px 0 var(--navy)}
    .custom{margin:22px 0 8px;text-align:left}.custom label{display:block;font-size:18px;font-weight:900;margin-bottom:7px}.custom input{width:100%;min-height:56px;border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px;color:var(--ink);background:#fff}.custom-note{margin:6px 0 0;color:#587080;font-size:14px}.start-btn,.again-btn{min-height:72px;min-width:min(360px,90%);margin-top:22px;border:0;border-radius:18px;background:var(--orange);color:#fff;font-size:30px;font-weight:900;box-shadow:0 7px 0 #a84b28;cursor:pointer}.start-btn:active,.again-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #a84b28}
    .game{flex-direction:column;padding:0 16px 22px}.route{width:min(900px,96vw);margin:16px auto 8px;padding:12px 18px 8px;background:var(--paper);border:3px solid var(--navy);border-radius:18px}.route-line{height:8px;background:var(--line);margin:13px 6%;position:relative}.route-fill{height:100%;width:0;background:var(--orange);transition:width .5s}.dots{display:flex;justify-content:space-between;position:relative;margin-top:-25px}.dot{width:30px;height:30px;border:4px solid var(--navy);border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:900}.dot.done{background:var(--yellow)}.dot.current{background:var(--orange);color:#fff;transform:scale(1.18)}
    .bus-shell{width:min(1060px,98vw);flex:1;min-height:500px;margin:auto;display:flex;flex-direction:column;position:relative;background:#e5edf0;border:7px solid var(--navy2);border-radius:30px 30px 18px 18px;overflow:hidden;box-shadow:0 12px 0 rgba(16,57,86,.25)}.bus-shell::before{content:"";height:50px;background:#d7e1e3;border-bottom:5px solid #71828c}.windows{position:absolute;inset:60px 12px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;height:175px}.window{border:7px solid #354b58;border-radius:16px;background:linear-gradient(#bdeaf2 65%,#80c25b 65%);overflow:hidden;position:relative}.window::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:repeating-linear-gradient(90deg,#69aa50 0 30px,#4a9646 30px 60px)}.cloud{position:absolute;width:70px;height:26px;border-radius:30px;background:rgba(255,255,255,.75);top:25px;left:18%;box-shadow:32px -12px 0 rgba(255,255,255,.75)}
    .mission{position:relative;z-index:3;width:min(820px,92%);margin:25px auto 18px;text-align:center;background:var(--paper);border:4px solid var(--navy);border-radius:18px;padding:13px 74px 13px 18px;font-size:clamp(20px,3vw,29px);font-weight:900;box-shadow:var(--shadow)}.mission .icon-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:23px}
    .signs{position:relative;z-index:4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);width:min(920px,94%);margin:auto auto 18px;align-items:center}.sign{position:relative;min-height:140px;border:7px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy2);font-size:clamp(38px,5.5vw,62px);font-weight:900;cursor:pointer;box-shadow:0 9px 0 #7593a5;padding:16px 56px 16px 12px}.sign::before{content:"정류장";position:absolute;top:0;left:0;background:var(--navy);color:#fff;font-size:13px;padding:4px 9px;border-radius:0 0 8px 0}.sign .speak-sign{position:absolute;right:9px;top:9px;width:44px;height:44px;border:0;border-radius:50%;background:var(--yellow);font-size:21px;cursor:pointer}.sign.hint{animation:glow 1s ease-in-out infinite}.sign.wrong{animation:shake .45s}.sign.correct{background:#dff1c8;border-color:var(--green)}
    .feedback{position:relative;z-index:6;height:58px;text-align:center;font-size:clamp(23px,4vw,36px);font-weight:900;color:var(--navy);padding-top:4px}.stars{position:absolute;inset:45% 0 auto;pointer-events:none;text-align:center;font-size:46px;animation:starburst 1s ease-out forwards}.driving .window::after{animation:roadMove .45s linear infinite}.driving .bus-shell{animation:busBounce .28s ease-in-out infinite alternate}
    .arrival{align-items:center;justify-content:center;padding:24px 16px}.arrival-card{width:min(820px,96vw);text-align:center;background:var(--paper);border:5px solid var(--navy);border-radius:var(--radius);padding:clamp(22px,4vw,42px);box-shadow:var(--shadow)}.arrival h2{font-size:clamp(40px,7vw,68px);color:var(--navy);margin:0 0 10px}.sticker-row{display:flex;justify-content:center;gap:clamp(6px,2vw,18px);font-size:clamp(44px,7vw,76px);margin:12px 0}.mission-card{margin:22px auto 10px;padding:22px;border:4px dashed var(--orange);border-radius:18px;background:#fff5cf}.mission-card h3{margin:0 0 9px;color:#9a3e21;font-size:23px}.mission-card p{margin:0;font-size:clamp(20px,3vw,28px);font-weight:900;line-height:1.4}.mission-card .icon-btn{margin-top:14px}
    .records{align-items:flex-start;justify-content:center;padding:22px 14px;overflow:auto}.records-card{width:min(960px,98vw);background:var(--paper);border:4px solid var(--navy);border-radius:18px;padding:20px}.records-head{display:flex;align-items:center;gap:12px}.records-head h2{margin:0;font-size:30px;color:var(--navy)}.records-head .icon-btn{margin-left:auto}.summary{font-size:19px;font-weight:900;margin:18px 0;padding:14px;background:var(--soft);border-radius:12px}.record-list{display:grid;gap:10px}.record-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;padding:13px;border-bottom:2px solid var(--line);font-size:17px}.record-row.header{font-weight:900;background:var(--navy);color:#fff;border-radius:10px}.empty{padding:38px;text-align:center;color:#587080}.clear-btn{margin-top:18px;border:2px solid var(--red);color:var(--red);background:var(--paper);border-radius:10px;padding:10px 14px;cursor:pointer}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}@keyframes glow{50%{box-shadow:0 0 0 12px rgba(255,216,90,.8),0 9px 0 #7593a5}}@keyframes starburst{0%{transform:scale(.2);opacity:0}35%{opacity:1}100%{transform:scale(1.6) translateY(-50px);opacity:0}}@keyframes roadMove{to{transform:translateX(-60px)}}@keyframes busBounce{to{transform:translateY(3px)}}
    @media(max-width:720px){.topbar{min-height:64px}.brand{font-size:18px}.brand-bus{font-size:30px}.records-btn{font-size:0;padding:0;min-width:52px}.records-btn::after{content:"기록";font-size:13px}.screen{min-height:calc(100dvh - 64px)}.levels{grid-template-columns:1fr}.level{min-height:68px}.start{align-items:flex-start}.start-card{padding:18px}.signs{grid-template-columns:1fr}.signs.two{grid-template-columns:1fr 1fr}.sign{min-height:120px;font-size:clamp(36px,10vw,52px)}.bus-shell{min-height:640px}.windows{height:150px}.mission{margin-top:18px}.record-row{grid-template-columns:1fr;font-size:16px}.record-row.header{display:none}}
    @media(max-height:700px) and (orientation:landscape){.topbar{min-height:58px;padding-block:5px}.brand-bus{font-size:28px}.sound-toggle,.records-btn{min-height:44px}.screen{min-height:calc(100dvh - 58px)}.route{margin:7px auto 4px;padding:5px 18px 1px}.bus-shell{min-height:390px}.bus-shell::before{height:34px}.windows{inset:42px 12px auto;height:125px}.mission{margin:12px auto 9px;padding-block:9px}.sign{min-height:115px}.feedback{height:45px}.start-card{padding:16px 28px}.start h1{font-size:38px}.start-line{margin:5px 0 10px}.level{min-height:70px}.custom{margin:12px 0 4px}.start-btn{min-height:58px;margin-top:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar"><div class="brand"><span class="brand-bus">🚌</span><span>정류장 이름 읽기</span></div><button class="records-btn" id="recordsBtn" aria-label="학습 기록 보기">학습 기록</button><button class="sound-toggle" id="soundToggle" aria-label="소리 끄기">🔊</button></header>
  <section class="screen start active" id="startScreen">
    <div class="start-card">
      <h1>버스를 타고 출발해요!</h1>
      <div class="start-line"><span id="destinationPreview">오늘은 마지막 정류장에 가요.</span><button class="icon-btn" data-speak-target="destinationPreview" aria-label="안내 읽기">🔊</button></div>
      <div class="level-label">단계를 골라 주세요.</div>
      <div class="levels" role="radiogroup" aria-label="난이도">
        <button class="level selected" data-level="1" role="radio" aria-checked="true">1단계<small>쉬운 낱말 · 2개 중 고르기</small></button>
        <button class="level" data-level="2" role="radio" aria-checked="false">2단계<small>받침 낱말 · 3개 중 고르기</small></button>
        <button class="level" data-level="3" role="radio" aria-checked="false">3단계<small>비슷한 낱말 · 3개 중 고르기</small></button>
      </div>
      <div class="custom"><label for="customWords">우리 동네 정류장 이름</label><input id="customWords" placeholder="예: 푸른마을, 행복공원, 중앙시장, 우리학교, 새봄도서관"><p class="custom-note">쉼표로 5개 이상 쓰면 우리 동네 이름으로 놀 수 있어요.</p></div>
      <button class="start-btn" id="startBtn">▶ 출발</button>
    </div>
  </section>
  <section class="screen game" id="gameScreen">
    <div class="route" aria-label="정류장 진행 상황"><div class="route-line"><div class="route-fill" id="routeFill"></div></div><div class="dots" id="dots"></div></div>
    <div class="bus-shell">
      <div class="windows"><div class="window"><i class="cloud"></i></div><div class="window"><i class="cloud"></i></div></div>
      <div class="mission"><span id="instruction">방송을 듣고 정류장을 눌러요.</span><button class="icon-btn" id="replayBtn" aria-label="방송 다시 듣기">🔊</button></div>
      <div class="feedback" id="feedback" aria-live="polite"></div><div class="signs" id="signs"></div>
    </div>
  </section>
  <section class="screen arrival" id="arrivalScreen"><div class="arrival-card"><h2>도착했어요!</h2><div class="sticker-row" aria-label="별 스티커 5개">⭐ ⭐ ⭐ ⭐ ⭐</div><div class="mission-card"><h3>🚌 진짜 버스 미션</h3><p id="realMission"></p><button class="icon-btn" data-speak-target="realMission" aria-label="미션 읽기">🔊</button></div><button class="again-btn" id="againBtn">↻ 다시 하기</button></div></section>
  <section class="screen records" id="recordsScreen"><div class="records-card"><div class="records-head"><h2>학습 기록</h2><button class="icon-btn" id="closeRecords" aria-label="기록 닫기">✕</button></div><div class="summary" id="summary"></div><div class="record-list" id="recordList"></div><button class="clear-btn" id="clearRecords">기록 지우기</button></div></section>
</main>
<script>
  const WORDS={1:['바다','나무','우리','하나','오리','사자','모자','기차','호수','가구'],2:['공원','병원','시장','학교','은행','약국','소방서','도서관','우체국','놀이터'],3:[['공원','공항','공장'],['시장','시청','시소'],['학교','학원','학생'],['병원','방울','병아리'],['은행','은하','인형']]};
  const PRAISE=['잘 읽었어요!','정말 잘했어요!','맞았어요!','멋지게 찾았어요!'];
  const MISSIONS=['버스 안 전광판에서 아는 글자를 하나 찾아 읽어 보기','정류장 표지판 이름을 소리 내어 읽어 보기','내릴 정류장 이름을 어른과 함께 미리 말해 보기','하차벨을 누르기 전에 전광판 이름을 확인하기'];
  let level=1,round=[],step=0,attempts=0,replays=0,soundOn=true,busy=false;
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
  function speak(text){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}
  function tone(freq,start,duration,gain=.12){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=window._busAudio||(window._busAudio=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(gain,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+start+duration);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+duration)}catch(e){}}
  function ding(){tone(660,0,.22);tone(880,.22,.32)}function vroom(){tone(110,0,.55,.06);tone(145,.2,.6,.05)}
  function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
  function customPool(){return $('#customWords').value.split(',').map(x=>x.trim()).filter(Boolean)}
  function makeRound(){const custom=customPool();if(custom.length>=5){const pool=shuffle(custom);return pool.slice(0,5).map(answer=>({answer,choices:shuffle([answer,...shuffle(pool.filter(x=>x!==answer)).slice(0,level===1?1:2)])}))}if(level===3){return shuffle(WORDS[3]).map(group=>{const answer=group[Math.floor(Math.random()*group.length)];return{answer,choices:shuffle(group)}})}const pool=shuffle(WORDS[level]);return pool.slice(0,5).map(answer=>({answer,choices:shuffle([answer,...shuffle(pool.filter(x=>x!==answer)).slice(0,level===1?1:2)])}))}
  function renderDots(){const d=$('#dots');d.innerHTML='';for(let i=0;i<5;i++){const x=document.createElement('span');x.className='dot '+(i<step?'done':i===step?'current':'');x.textContent=i+1;d.appendChild(x)}$('#routeFill').style.width=(step*25)+'%'}
  function announce(){speak('다음 정류장은 '+round[step].answer+'입니다')}
  function renderQuestion(){busy=false;attempts=0;replays=0;$('#feedback').textContent='';renderDots();const box=$('#signs');box.className='signs '+(round[step].choices.length===2?'two':'');box.innerHTML='';round[step].choices.forEach(word=>{const b=document.createElement('button');b.className='sign';b.dataset.word=word;b.innerHTML='<span>'+word+'</span><button class="speak-sign" aria-label="'+word+' 읽기">🔊</button>';b.addEventListener('click',e=>{if(e.target.classList.contains('speak-sign')){e.stopPropagation();speak(word);return}choose(b,word)});box.appendChild(b)});setTimeout(announce,350)}
  function saveRecord(word,result,replayCount){let records=[];try{records=JSON.parse(localStorage.getItem('bus-reading-records')||'[]');records.push({word,result,replays:replayCount,date:new Date().toLocaleDateString('ko-KR')});localStorage.setItem('bus-reading-records',JSON.stringify(records.slice(-100)))}catch(e){}}
  function choose(button,word){if(busy)return;attempts++;if(word!==round[step].answer){button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');$('#feedback').textContent='다시 해 볼까?';speak('다시 해 볼까?');if(attempts>=2){$$('.sign').find(x=>x.dataset.word===round[step].answer)?.classList.add('hint')}return}busy=true;button.classList.add('correct');const praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];$('#feedback').textContent=praise;const stars=document.createElement('div');stars.className='stars';stars.textContent='⭐ ✨ ⭐';$('.bus-shell').appendChild(stars);ding();setTimeout(()=>speak(praise),180);saveRecord(word,attempts===1?'1번':attempts===2?'2번':'힌트',replays);setTimeout(()=>{stars.remove();if(step===4){$('#routeFill').style.width='100%';setTimeout(arrive,500)}else{$('#gameScreen').classList.add('driving');vroom();setTimeout(()=>{$('#gameScreen').classList.remove('driving');step++;renderQuestion()},1100)}},1000)}
  function start(){round=makeRound();step=0;show('#gameScreen');renderQuestion()}
  function arrive(){show('#arrivalScreen');const m=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];$('#realMission').textContent=m;ding();setTimeout(()=>speak('도착했어요! 별 스티커 다섯 개를 받았어요.'),250)}
  function renderRecords(){let records=[];try{records=JSON.parse(localStorage.getItem('bus-reading-records')||'[]')}catch(e){}const misses={};records.forEach(r=>{if(r.result!=='1번')misses[r.word]=(misses[r.word]||0)+1});const frequent=Object.entries(misses).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]).join(', ');$('#summary').textContent=records.length?'자주 어려웠던 낱말: '+(frequent||'아직 없어요'):'아직 저장된 기록이 없어요.';const list=$('#recordList');list.innerHTML='<div class="record-row header"><span>낱말</span><span>정답까지</span><span>방송 다시 듣기</span></div>';records.slice().reverse().forEach(r=>{const row=document.createElement('div');row.className='record-row';row.innerHTML='<strong>'+r.word+'</strong><span>'+r.result+'</span><span>'+r.replays+'번</span>';list.appendChild(row)});if(!records.length)list.innerHTML+='<div class="empty">게임을 마치면 여기에 기록이 보여요.</div>'}
  $$('.level').forEach(b=>b.addEventListener('click',()=>{$$('.level').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-checked','false')});b.classList.add('selected');b.setAttribute('aria-checked','true');level=Number(b.dataset.level)}));
  $('#startBtn').addEventListener('click',start);$('#againBtn').addEventListener('click',()=>show('#startScreen'));$('#replayBtn').addEventListener('click',()=>{if(busy)return;replays++;announce()});
  $('#soundToggle').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기');if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel()});
  $$('[data-speak-target]').forEach(b=>b.addEventListener('click',()=>speak($('#'+b.dataset.speakTarget).textContent)));
  $('#recordsBtn').addEventListener('click',()=>{renderRecords();show('#recordsScreen')});$('#closeRecords').addEventListener('click',()=>show('#startScreen'));$('#clearRecords').addEventListener('click',()=>{try{localStorage.removeItem('bus-reading-records')}catch(e){}renderRecords()});
</script>
</body>
</html>
