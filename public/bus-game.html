<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>버스 타기 국어 게임 - 글자 카드로 정류장 만들기</title>
  <meta name="description" content="버스 창밖 정류장을 보고 자음과 모음 카드로 이름을 만드는 어린이 국어 게임">
  <style>
    :root{--cream:#fff9e9;--paper:#fffef8;--ink:#263843;--navy:#225074;--blue:#8ed6e8;--sky:#c7eff5;--mint:#9bd39a;--green:#5e9b64;--yellow:#ffd65a;--orange:#ee8148;--red:#db5d55;--steel:#516774;--line:#bfd5d7;--shadow:0 7px 0 rgba(38,56,67,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Noto Sans KR",Arial,sans-serif;color:var(--ink);background:#d7edf0;letter-spacing:0}button{font:inherit;touch-action:manipulation}button:focus-visible{outline:5px solid var(--yellow);outline-offset:3px}
    .app{height:100dvh;min-height:620px;display:flex;flex-direction:column;overflow:hidden;background:#dce6e7}
    .topbar{height:68px;flex:none;display:flex;align-items:center;padding:8px clamp(14px,3vw,34px);background:var(--cream);border-bottom:4px solid var(--navy);gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:clamp(18px,2.5vw,27px);font-weight:900;color:var(--navy)}.brand-bus{font-size:34px}.progress{margin-left:auto;display:flex;align-items:center;gap:7px}.dot{width:28px;height:28px;border:3px solid var(--navy);border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:12px;font-weight:900}.dot.done{background:var(--yellow)}.dot.current{background:var(--orange);color:white;transform:scale(1.13)}
    .help-btn{flex:none;width:42px;height:42px;border:3px solid var(--navy);border-radius:50%;background:var(--paper);color:var(--navy);font-size:24px;font-weight:900;cursor:pointer}
    .game{flex:1;min-height:0;display:grid;grid-template-rows:minmax(245px,45%) minmax(0,1fr);position:relative}
    .bus-view{position:relative;background:#627780;padding:14px clamp(14px,3vw,42px) 0;overflow:hidden}.ceiling{position:absolute;inset:0 0 auto;height:29px;background:#415762;border-bottom:5px solid #304650}.handle{position:absolute;z-index:4;top:0;width:56px;height:57px;border:7px solid var(--paper);border-top:0;border-radius:0 0 25px 25px;opacity:.9}.handle.one{left:13%}.handle.two{right:13%}
    .question{position:absolute;z-index:8;top:11px;left:50%;transform:translateX(-50%);margin:0;padding:10px 28px;background:var(--cream);border:4px solid var(--navy);border-radius:13px;box-shadow:0 5px 0 rgba(20,54,75,.22);font-size:clamp(21px,3vw,33px);font-weight:900;color:var(--navy);white-space:nowrap}
    .window-frame{height:100%;max-width:1030px;margin:auto;padding:37px 18px 17px;background:#384f5b;border:6px solid #243b47;border-radius:22px 22px 5px 5px;box-shadow:inset 0 0 0 5px #71868d}.window{height:100%;position:relative;overflow:hidden;border:6px solid #293f4a;border-radius:12px;background:var(--sky)}
    .sun{position:absolute;width:68px;height:68px;border-radius:50%;background:var(--yellow);top:22px;right:8%}.cloud{position:absolute;width:100px;height:31px;border-radius:30px;background:rgba(255,255,255,.9);top:37px;left:7%;box-shadow:35px -18px 0 rgba(255,255,255,.9)}.hills{position:absolute;inset:auto 0 38%;height:32%;background:#53a95a;clip-path:ellipse(78% 62% at 50% 100%)}.town{position:absolute;inset:auto 0 20%;height:42%;background:repeating-linear-gradient(90deg,#ff8a5b 0 72px,#ffd85a 72px 150px,#f6a45f 150px 222px);clip-path:polygon(0 28%,8% 28%,8% 4%,17% 4%,17% 43%,27% 43%,27% 17%,36% 17%,36% 50%,47% 50%,47% 8%,57% 8%,57% 39%,68% 39%,68% 1%,77% 1%,77% 45%,88% 45%,88% 19%,96% 19%,96% 38%,100% 38%,100% 100%,0 100%)}.town::after{content:"";position:absolute;inset:18% 2% 10%;background:repeating-linear-gradient(90deg,transparent 0 18px,var(--navy) 18px 29px,transparent 29px 50px);opacity:.65}.tree{position:absolute;z-index:2;bottom:19%;width:36px;height:34%;background:#7a4d31;border-radius:50% 50% 0 0}.tree::before{content:"";position:absolute;width:125px;height:105px;left:50%;top:-55px;transform:translateX(-50%);border-radius:50%;background:#53a95a;box-shadow:-35px 25px 0 #6fbd4b,38px 21px 0 #82ca4d}.tree.left{left:9%}.tree.right{right:8%}.road{position:absolute;inset:auto 0 0;height:20%;background:#69717c;border-top:9px solid var(--paper)}.road::before{content:"";position:absolute;inset:-9px 0 auto;height:9px;background:repeating-linear-gradient(90deg,var(--red) 0 54px,var(--paper) 54px 108px)}.road::after{content:"";position:absolute;inset:57% 0 auto;height:6px;background:repeating-linear-gradient(90deg,var(--paper) 0 46px,transparent 46px 84px)}
    .stop{position:absolute;z-index:5;left:50%;bottom:18%;transform:translateX(-50%);width:clamp(265px,46vw,480px);height:58%;}.shelter-roof{position:absolute;z-index:4;left:4%;top:0;width:92%;height:27%;border:5px solid #566d78;border-radius:80% 80% 12px 12px;background:linear-gradient(150deg,rgba(255,255,255,.68),rgba(70,191,217,.42) 45%,rgba(66,91,105,.78));box-shadow:0 5px 0 rgba(38,56,67,.18),inset 0 7px 0 rgba(255,255,255,.28)}.shelter-glass{position:absolute;left:9%;right:9%;top:23%;bottom:3%;border:5px solid var(--steel);border-top:0;background:rgba(225,249,251,.42);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}.shelter-glass::before,.shelter-glass::after{content:"";position:absolute;top:0;bottom:0;width:5px;background:var(--steel)}.shelter-glass::before{left:33%}.shelter-glass::after{right:33%}.bench{position:absolute;z-index:3;left:18%;right:18%;bottom:11%;height:20%;border:5px solid #9f3f22;border-radius:10px;background:var(--orange);box-shadow:inset 0 -8px 0 rgba(159,63,34,.25)}.bench::before,.bench::after{content:"";position:absolute;top:100%;width:8px;height:25px;background:#7c452e}.bench::before{left:16%}.bench::after{right:16%}.stop-board{position:absolute;z-index:7;left:50%;top:26%;transform:translateX(-50%);min-width:clamp(145px,25vw,260px);padding:5px 14px 8px;text-align:center;background:var(--paper);border:5px solid var(--navy);border-radius:16px;box-shadow:var(--shadow)}.stop-board small{display:block;padding-bottom:1px;font-size:10px;color:var(--green)}.stop-board strong{font-size:clamp(27px,4.3vw,45px);color:var(--navy);white-space:nowrap}.bus-sign{position:absolute;z-index:8;right:-3%;bottom:0;display:flex;flex-direction:column;align-items:center}.sign-head{width:58px;height:58px;border:6px solid var(--navy);border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:var(--navy);font-size:25px;box-shadow:0 4px 0 rgba(38,56,67,.2)}.sign-pole{width:9px;height:93px;background:var(--steel);border:2px solid #344953}.window-glint{position:absolute;z-index:9;inset:-25% auto -25% 23%;width:16%;transform:rotate(12deg);background:rgba(255,255,255,.12);pointer-events:none}
    .panel{position:relative;z-index:10;background:var(--cream);border-top:7px solid var(--navy);padding:12px clamp(12px,3vw,32px) 15px;overflow:auto}.panel-inner{max-width:1050px;margin:auto}.instruction{text-align:center;font-size:clamp(17px,2.2vw,24px);font-weight:900;margin:0 0 8px}.answer-row{display:flex;align-items:center;justify-content:center;gap:10px}.syllables{min-height:76px;display:flex;align-items:center;justify-content:center;gap:12px}.syllable{display:flex;gap:5px;padding:6px;border-bottom:5px solid var(--navy)}.slot{width:clamp(42px,6vw,61px);height:58px;display:grid;place-items:center;border:3px dashed var(--line);border-radius:9px;background:var(--paper);font-size:clamp(30px,4vw,42px);font-weight:900;color:var(--navy)}.slot.filled{border-style:solid;border-color:var(--orange);background:#fff3c5}.back-btn{width:52px;height:52px;border:3px solid var(--navy);border-radius:50%;background:var(--paper);font-size:24px;color:var(--navy);cursor:pointer}.back-btn:disabled{opacity:.35}
    .feedback{height:33px;text-align:center;font-size:clamp(19px,2.5vw,25px);font-weight:900;color:var(--green)}.feedback.try{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(var(--card-columns),minmax(0,1fr));justify-items:center;gap:3px clamp(3px,1vw,12px);max-width:980px;margin:auto;padding:0 7px;background:repeating-linear-gradient(to bottom,var(--steel) 0 8px,transparent 8px 108px)}.card{position:relative;width:100%;max-width:79px;height:105px;padding:25px 0 0;border:0;background:transparent;color:var(--navy);cursor:pointer}.card::before{content:"";position:absolute;z-index:0;left:50%;top:5px;transform:translateX(-50%);width:11px;height:25px;border:3px solid var(--navy);border-top:0;background:var(--line)}.grip{position:relative;z-index:1;display:grid;place-items:center;width:100%;height:73px;border:7px solid var(--navy);border-radius:17px 17px 25px 25px;background:var(--paper);box-shadow:0 5px 0 #91a8ae;transition:transform .16s}.glyph{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(30px,4vw,43px);font-weight:900;line-height:1}.card:nth-child(3n+1) .grip{background:#fff0b7}.card:nth-child(3n+2) .grip{background:#dff2dd}.card:active .grip{transform:translateY(4px);box-shadow:0 1px 0 #91a8ae}.card:disabled{opacity:.23;cursor:default}.card:disabled .grip{box-shadow:none}
    .tutorial{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(22,47,61,.7)}.tutorial.show{display:flex}.tutorial-box{width:min(520px,100%);padding:clamp(18px,4vw,30px);border:5px solid var(--navy);border-radius:18px;background:var(--cream);box-shadow:0 15px 0 rgba(19,44,60,.28);text-align:center}.tutorial-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tutorial-count{font-size:17px;font-weight:900;color:var(--navy)}.tutorial-skip{border:0;background:transparent;color:var(--navy);text-decoration:underline;font-size:17px;font-weight:900;cursor:pointer;min-height:44px}.tutorial-scene{height:170px;margin:12px auto 15px;border:4px solid var(--navy);border-radius:13px;background:linear-gradient(var(--sky) 65%,var(--green) 65% 77%,#69717c 77%);display:grid;place-items:center;overflow:hidden}.tutorial-example{display:grid;place-items:center;min-width:150px;min-height:74px;padding:8px 18px;border:5px solid var(--navy);border-radius:14px;background:var(--paper);color:var(--navy);font-size:43px;font-weight:900;box-shadow:0 6px 0 rgba(38,56,67,.18)}.tutorial-scene.handles{background:var(--cream)}.tutorial-scene.handles .tutorial-example{border:0;background:transparent;box-shadow:none;display:flex;gap:12px}.tutorial-mini{display:grid;place-items:center;width:65px;height:72px;border:7px solid var(--navy);border-radius:17px 17px 25px 25px;background:var(--yellow);font-size:42px}.tutorial-scene.slots{background:var(--cream)}.tutorial-scene.slots .tutorial-example{display:flex;gap:8px;border:0;background:transparent;box-shadow:none}.tutorial-slot{display:grid;place-items:center;width:58px;height:65px;border:3px dashed var(--navy);border-radius:9px;background:var(--paper);font-size:36px}.tutorial-box h2{margin:0 0 8px;color:var(--navy);font-size:clamp(25px,5vw,34px)}.tutorial-box p{min-height:54px;margin:0 0 15px;font-size:clamp(18px,3vw,22px);font-weight:800;line-height:1.4}.tutorial-next{min-height:60px;min-width:190px;padding:10px 25px;border:0;border-radius:13px;background:var(--orange);color:white;box-shadow:0 6px 0 #a84b28;font-size:23px;font-weight:900;cursor:pointer}
    .celebrate{position:fixed;z-index:30;inset:0;display:none;place-items:center;background:rgba(28,58,71,.25)}.celebrate.show{display:grid}.success{padding:25px 42px;background:var(--paper);border:6px solid var(--navy);border-radius:18px;box-shadow:0 12px 0 rgba(20,54,75,.25);text-align:center;animation:pop .35s ease-out}.success .stars{font-size:48px}.success strong{display:block;font-size:clamp(31px,6vw,56px);color:var(--navy)}
    .finish{position:fixed;z-index:40;inset:0;display:none;place-items:center;padding:20px;background:var(--sky)}.finish.show{display:grid}.finish-card{width:min(630px,94vw);padding:36px;text-align:center;background:var(--paper);border:6px solid var(--navy);border-radius:18px;box-shadow:var(--shadow)}.finish-card .bus{font-size:80px}.finish-card h1{font-size:clamp(38px,7vw,62px);margin:4px 0;color:var(--navy)}.finish-card p{font-size:22px;font-weight:900}.again{min-width:240px;min-height:64px;border:0;border-radius:14px;background:var(--orange);color:white;box-shadow:0 7px 0 #a84b28;font-size:25px;font-weight:900;cursor:pointer}
    @keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}@keyframes pass{to{transform:translateX(-120vw)}}.moving .stop{animation:pass .8s ease-in forwards}.moving .town{animation:pass .8s ease-in forwards}
    @media(max-width:650px){.app{min-height:680px}.topbar{height:60px;gap:7px}.brand{font-size:17px}.brand-bus{font-size:28px}.dot{width:23px;height:23px;border-width:2px}.help-btn{width:35px;height:35px;font-size:19px}.game{grid-template-rows:minmax(300px,46%) 1fr}.bus-view{padding-inline:7px}.window-frame{padding-inline:8px}.question{top:10px;padding:8px 14px}.panel{padding-top:9px}.syllables{min-height:66px}.slot{height:51px}.feedback{height:30px}.cards{gap:3px 5px}.card{height:105px}.stop{bottom:17%;width:76vw;height:53%}.tree{height:31%}.tree.left{left:3%}.tree.right{right:2%}.stop-board{top:27%}.sign-head{width:48px;height:48px;font-size:21px}.sign-pole{height:72px}}
    @media(max-height:720px) and (orientation:landscape){.app{min-height:520px}.topbar{height:54px}.game{grid-template-columns:52% 48%;grid-template-rows:1fr}.bus-view{padding:8px 6px 0}.question{font-size:21px}.panel{border-top:0;border-left:7px solid var(--navy);padding:13px}.instruction{font-size:18px}.slot{width:42px;height:45px;font-size:29px}.syllables{min-height:58px}.feedback{height:28px}.card{height:105px}.window-frame{padding-top:34px}.stop-board strong{font-size:34px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-bus">🚌</span><span>글자 버스 여행</span></div><div class="progress" id="progress" aria-label="정류장 진행 상황"></div><button class="help-btn" id="helpBtn" aria-label="놀이 방법 다시 보기" title="놀이 방법 다시 보기">?</button></header>
    <section class="game" id="game">
      <div class="bus-view"><div class="ceiling"></div><i class="handle one"></i><i class="handle two"></i><h1 class="question">이번 정류장은 어디일까요?</h1><div class="window-frame"><div class="window"><div class="sun"></div><div class="cloud"></div><div class="hills"></div><div class="town"></div><div class="tree left"></div><div class="tree right"></div><div class="road"></div><div class="stop" id="stop"><div class="shelter-roof"></div><div class="shelter-glass"></div><div class="bench"></div><div class="stop-board"><small>BUS STOP · 정류장</small><strong id="stopName"></strong></div><div class="bus-sign"><div class="sign-head">🚌</div><div class="sign-pole"></div></div></div><div class="window-glint"></div></div></div></div>
      <div class="panel"><div class="panel-inner"><p class="instruction">창밖 이름을 보고 손잡이 글자를 차례로 눌러요.</p><div class="answer-row"><div class="syllables" id="syllables" aria-label="만들고 있는 정류장 이름"></div><button class="back-btn" id="backBtn" aria-label="마지막 글자 지우기" title="마지막 글자 지우기">↶</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="cards" id="cards"></div></div></div>
    </section>
    <div class="celebrate" id="celebrate" aria-hidden="true"><div class="success"><div class="stars">⭐ ✨ ⭐</div><strong>정류장 완성!</strong></div></div>
    <section class="finish" id="finish"><div class="finish-card"><div class="bus">🚌</div><h1>모두 도착했어요!</h1><p>정류장 이름 5개를 멋지게 만들었어요.</p><button class="again" id="againBtn">다시 여행하기</button></div></section>
    <div class="tutorial" id="tutorial" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle" aria-hidden="true"><div class="tutorial-box"><div class="tutorial-top"><span class="tutorial-count" id="tutorialCount"></span><button class="tutorial-skip" id="tutorialSkip">건너뛰기</button></div><div class="tutorial-scene" id="tutorialScene"><div class="tutorial-example" id="tutorialExample"></div></div><h2 id="tutorialTitle"></h2><p id="tutorialText"></p><button class="tutorial-next" id="tutorialNext"></button></div></div>
  </main>
  <script>
    const STOPS=[
      {name:'나무',parts:[['ㄴ','ㅏ'],['ㅁ','ㅜ']],extra:['ㄱ','ㅇ']},
      {name:'바다',parts:[['ㅂ','ㅏ'],['ㄷ','ㅏ']],extra:['ㅗ','ㄴ']},
      {name:'학교',parts:[['ㅎ','ㅏ','ㄱ'],['ㄱ','ㅛ']],extra:['ㅜ','ㅇ']},
      {name:'공원',parts:[['ㄱ','ㅗ','ㅇ'],['ㅇ','ㅝ','ㄴ']],extra:['ㅏ','ㅎ']},
      {name:'은행',parts:[['ㅇ','ㅡ','ㄴ'],['ㅎ','ㅐ','ㅇ']],extra:['ㄱ','ㅜ']}
    ];
    let step=0,selected=[],locked=false;
    const $=s=>document.querySelector(s);
    const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    function answer(){return STOPS[step].parts.flat()}
    function renderProgress(){const box=$('#progress');box.innerHTML='';STOPS.forEach((_,i)=>{const d=document.createElement('span');d.className='dot '+(i<step?'done':i===step?'current':'');d.textContent=i<step?'✓':i+1;box.appendChild(d)})}
    function renderSlots(){const box=$('#syllables');box.innerHTML='';let at=0;STOPS[step].parts.forEach(group=>{const syll=document.createElement('div');syll.className='syllable';group.forEach(()=>{const slot=document.createElement('span');slot.className='slot'+(selected[at]?' filled':'');slot.textContent=selected[at]||'';syll.appendChild(slot);at++});box.appendChild(syll)});$('#backBtn').disabled=!selected.length||locked}
    function renderCards(){const pool=shuffle([...answer(),...STOPS[step].extra]);const box=$('#cards');box.innerHTML='';box.style.setProperty('--card-columns',Math.min(pool.length,window.innerWidth<=650?4:window.innerWidth<=900?6:10));pool.forEach((letter,index)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="grip"><span class="glyph"></span></span>';b.querySelector('.glyph').textContent=letter;b.dataset.index=index;b.dataset.letter=letter;b.setAttribute('aria-label',letter+' 카드');b.addEventListener('click',()=>pick(letter,b));box.appendChild(b)})}
    function renderStop(){locked=false;selected=[];$('#feedback').textContent='';$('#feedback').className='feedback';$('#stopName').textContent=STOPS[step].name;renderProgress();renderSlots();renderCards()}
    function pick(letter,button){if(locked)return;selected.push(letter);button.disabled=true;renderSlots();if(selected.length===answer().length)check()}
    function check(){if(selected.join('')===answer().join('')){locked=true;$('#feedback').textContent='맞았어요! '+STOPS[step].name+' 정류장이에요.';$('#celebrate').classList.add('show');setTimeout(()=>{$('#celebrate').classList.remove('show');if(step===STOPS.length-1){$('#finish').classList.add('show')}else{$('#game').classList.add('moving');setTimeout(()=>{step++;$('#game').classList.remove('moving');renderStop()},800)}},850)}else{$('#feedback').textContent='순서를 다시 살펴볼까요?';$('#feedback').className='feedback try';setTimeout(()=>{selected=[];document.querySelectorAll('.card').forEach(b=>b.disabled=false);renderSlots()},650)}}
    $('#backBtn').addEventListener('click',()=>{if(!selected.length||locked)return;selected.pop();document.querySelectorAll('.card').forEach(b=>b.disabled=false);const used=[...selected];document.querySelectorAll('.card').forEach(b=>{const i=used.indexOf(b.dataset.letter);if(i>=0){b.disabled=true;used.splice(i,1)}});$('#feedback').textContent='';renderSlots()});
    $('#againBtn').addEventListener('click',()=>{step=0;$('#finish').classList.remove('show');renderStop()});
    const TUTORIAL=[
      {title:'창밖 정류장을 봐요',text:'표지판에 적힌 이름을 눈으로 살펴보세요.',scene:'',example:'나무'},
      {title:'손잡이 글자를 눌러요',text:'버스 손잡이에 달린 자음과 모음을 차례대로 눌러요.',scene:'handles',example:'<span class="tutorial-mini">ㄴ</span><span class="tutorial-mini">ㅏ</span>'},
      {title:'이름을 완성해요',text:'빈칸을 모두 채우면 다음 정류장으로 출발해요!',scene:'slots',example:'<span class="tutorial-slot">ㄴ</span><span class="tutorial-slot">ㅏ</span><span class="tutorial-slot">ㅁ</span><span class="tutorial-slot">ㅜ</span>'}
    ];
    let tutorialStep=0;
    function drawTutorial(){const t=TUTORIAL[tutorialStep];$('#tutorialCount').textContent=(tutorialStep+1)+' / '+TUTORIAL.length;$('#tutorialTitle').textContent=t.title;$('#tutorialText').textContent=t.text;$('#tutorialScene').className='tutorial-scene '+t.scene;$('#tutorialExample').innerHTML=t.example;$('#tutorialNext').textContent=tutorialStep===TUTORIAL.length-1?'출발하기':'다음'}
    function openTutorial(){tutorialStep=0;drawTutorial();$('#tutorial').classList.add('show');$('#tutorial').setAttribute('aria-hidden','false');$('#tutorialNext').focus()}
    function closeTutorial(){try{localStorage.setItem('bus-letter-tutorial-seen','yes')}catch(e){}$('#tutorial').classList.remove('show');$('#tutorial').setAttribute('aria-hidden','true');$('#helpBtn').focus()}
    $('#tutorialNext').addEventListener('click',()=>{if(tutorialStep===TUTORIAL.length-1)closeTutorial();else{tutorialStep++;drawTutorial()}});
    $('#tutorialSkip').addEventListener('click',closeTutorial);
    $('#helpBtn').addEventListener('click',openTutorial);
    renderStop();
    try{if(localStorage.getItem('bus-letter-tutorial-seen')!=='yes')openTutorial()}catch(e){openTutorial()}
  </script>
</body>
</html>
